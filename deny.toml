# cargo-deny 配置：闭源商用，只允许宽松许可依赖（见 docs/DECISIONS.md 第 9 项）
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[[licenses.clarify]]
crate = "gitdeck-core"
expression = "LicenseRef-Proprietary"
license-files = []

[[licenses.clarify]]
crate = "uniffi-bindgen"
expression = "LicenseRef-Proprietary"
license-files = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
