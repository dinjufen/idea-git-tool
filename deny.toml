# cargo-deny 配置：闭源商用，只允许宽松许可依赖（见 docs/DECISIONS.md 第 9 项）
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[[licenses.clarify]]
crate = "gitdeck-core"
expression = "LicenseRef-Proprietary"
license-files = []

[[licenses.clarify]]
crate = "uniffi-bindgen"
expression = "LicenseRef-Proprietary"
license-files = []

# MPL-2.0 仅对 UniFFI 例外放行（只使用、不修改源文件；见 docs/DECISIONS.md 第 12 项）
[[licenses.exceptions]]
crate = "uniffi"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_bindgen"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_core"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_internal_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_meta"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_pipeline"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "uniffi_udl"
allow = ["MPL-2.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
