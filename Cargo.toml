[workspace]
resolver = "3"
members = ["core/gitdeck-core", "core/uniffi-bindgen"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
uniffi = "=0.31.0"
thiserror = "2"
which = "8"
tempfile = "3"
similar = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 系统原生 TLS（macOS Security.framework / Windows SChannel），使用系统信任库，避免引入 webpki-roots。
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-json = "0.24"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-md = "0.5"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-swift = "0.7"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
